services:
  postgres:
    image: postgres:16
    profiles:
      - local
    container_name: touchmyapi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: touchmyapi
      POSTGRES_USER: touchmyapi_dev
      # Local development only. Override via POSTGRES_PASSWORD in the shell or a
      # compose-local .env file. Never reuse a production or Stripe credential.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-touchmyapi_dev}
    ports:
      # Loopback-only bind: PostgreSQL is never exposed to other interfaces.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U touchmyapi_dev -d touchmyapi"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    # Official MinIO release pinned by tag and digest for reproducible local runs.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    profiles:
      - local
    container_name: touchmyapi-minio
    restart: unless-stopped
    environment:
      # Local development only. Supply non-default credentials outside local
      # development; application credentials use OBJECT_STORAGE_* variables.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-touchmyapi_dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-touchmyapi_dev_change_me}
    command: server /data --console-address ":9001"
    ports:
      # Loopback-only binds keep the development object store private.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
