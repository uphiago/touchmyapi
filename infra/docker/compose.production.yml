name: touchmyapi

x-api-common: &api-common
  image: ghcr.io/uphiago/touchmyapi-api:${TOUCHMYAPI_IMAGE_TAG:?TOUCHMYAPI_IMAGE_TAG is required}
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  security_opt:
    - no-new-privileges:true
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    <<: *api-common
    restart: "no"
    command: ["bun", "packages/db/scripts/migrate.ts"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL:?AUTH_DATABASE_URL is required}
      API_DATABASE_URL: ${API_DATABASE_URL:?API_DATABASE_URL is required}
      AUDIT_DATABASE_URL: ${AUDIT_DATABASE_URL:?AUDIT_DATABASE_URL is required}
      QUEUE_DATABASE_URL: ${QUEUE_DATABASE_URL:?QUEUE_DATABASE_URL is required}
      WORKER_DATABASE_URL: ${WORKER_DATABASE_URL:?WORKER_DATABASE_URL is required}
      REPORTING_DATABASE_URL: ${REPORTING_DATABASE_URL:?REPORTING_DATABASE_URL is required}
      LOCAL_MOCKS: "0"
      LOCAL_ADMIN_MOCKS: "0"

  api:
    <<: *api-common
    environment:
      NODE_ENV: production
      PORT: "3000"
      CORS_ORIGIN: ${CUSTOMER_WEB_ORIGIN:?CUSTOMER_WEB_ORIGIN is required}
      WEB_APP_ORIGIN: ${CUSTOMER_WEB_ORIGIN:?CUSTOMER_WEB_ORIGIN is required}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-disabled}
      AUTH_TRANSIENT_KEY: ${AUTH_TRANSIENT_KEY:?AUTH_TRANSIENT_KEY is required}
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL:?AUTH_DATABASE_URL is required}
      API_DATABASE_URL: ${API_DATABASE_URL:?API_DATABASE_URL is required}
      AUDIT_DATABASE_URL: ${AUDIT_DATABASE_URL:?AUDIT_DATABASE_URL is required}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-auto}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:-}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_CALLBACK_URL: ${GITHUB_OAUTH_CALLBACK_URL:-}
      LOCAL_MOCKS: "0"
      LOCAL_ADMIN_MOCKS: "0"
    ports:
      - "127.0.0.1:${CUSTOMER_API_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://127.0.0.1:3000/health');if(!r.ok)process.exit(1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  admin-api:
    <<: *api-common
    command: ["bun", "apps/api/dist/admin-server.js"]
    environment:
      NODE_ENV: production
      ADMIN_PORT: "3001"
      ADMIN_CORS_ORIGIN: ${ADMIN_WEB_ORIGIN:?ADMIN_WEB_ORIGIN is required}
      LOCAL_MOCKS: "0"
      LOCAL_ADMIN_MOCKS: "0"
    ports:
      - "127.0.0.1:${ADMIN_API_PORT:-3001}:3001"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://127.0.0.1:3001/health');if(!r.ok)process.exit(1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    image: ghcr.io/uphiago/touchmyapi-web:${TOUCHMYAPI_IMAGE_TAG:?TOUCHMYAPI_IMAGE_TAG is required}
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${CUSTOMER_WEB_PORT:-8080}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://127.0.0.1:8080/health');if(!r.ok)process.exit(1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  admin:
    image: ghcr.io/uphiago/touchmyapi-admin:${TOUCHMYAPI_IMAGE_TAG:?TOUCHMYAPI_IMAGE_TAG is required}
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${ADMIN_WEB_PORT:-8081}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://127.0.0.1:8080/health');if(!r.ok)process.exit(1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  # The runner adapter is not production-capable until the isolated sandbox
  # implementation is available. Keep the worker artifact and health boundary
  # in Compose, but exclude it from the default cutover.
  worker:
    image: ghcr.io/uphiago/touchmyapi-worker:${TOUCHMYAPI_IMAGE_TAG:?TOUCHMYAPI_IMAGE_TAG is required}
    profiles: [execution]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      RUNNER_MODE: ${RUNNER_MODE:-isolated}
      QUEUE_DATABASE_URL: ${QUEUE_DATABASE_URL:?QUEUE_DATABASE_URL is required}
      WORKER_DATABASE_URL: ${WORKER_DATABASE_URL:?WORKER_DATABASE_URL is required}
      WORKER_ID: ${WORKER_ID:-ovh-worker}
      WORKER_PORT: "3002"
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-auto}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:-}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-}
    ports:
      - "127.0.0.1:${WORKER_PORT:-3002}:3002"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://127.0.0.1:3002/ready');if(!r.ok)process.exit(1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    name: ${POSTGRES_DATA_VOLUME:-touchmyapi-postgres-data}
