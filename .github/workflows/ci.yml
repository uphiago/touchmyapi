name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://touchmyapi_migrate:touchmyapi_migrate@localhost:5432/touchmyapi_test
      RUN_DB_TESTS: "1"
      NODE_ENV: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: touchmyapi_test
          POSTGRES_USER: touchmyapi_migrate
          POSTGRES_PASSWORD: touchmyapi_migrate
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U touchmyapi_migrate -d touchmyapi_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify workspace
        run: bun run verify:workspace

      - name: Apply database migrations
        run: bun run db:migrate

      - name: Run unit tests
        run: bun run test:unit

      - name: Run contract tests
        run: bun run test:contract

      - name: Run integration tests
        run: bun run test:integration

      - name: Run isolation tests
        run: bun run test:isolation

      - name: Run e2e gate
        run: bun run test:e2e

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format

      - name: Build web application
        run: bun run --cwd apps/web build

      - name: Validate compose configuration
        run: docker compose -f infra/docker/compose.yml config

      - name: Check diff whitespace
        run: git diff --check
