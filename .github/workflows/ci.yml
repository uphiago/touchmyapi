name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      RUN_DB_TESTS: "1"
      NODE_ENV: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: touchmyapi_test
          POSTGRES_USER: touchmyapi_migrate
          POSTGRES_PASSWORD: touchmyapi_migrate
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U touchmyapi_migrate -d touchmyapi_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify workspace
        run: bun run verify:workspace

      - name: Create isolated test databases
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=touchmyapi_migrate postgres:16 \
            psql -h 127.0.0.1 -U touchmyapi_migrate -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE touchmyapi_ci_integration_test'
          docker run --rm --network host \
            -e PGPASSWORD=touchmyapi_migrate postgres:16 \
            psql -h 127.0.0.1 -U touchmyapi_migrate -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE touchmyapi_ci_isolation_test'

      - name: Apply database migrations
        run: |
          DATABASE_URL=postgres://touchmyapi_migrate:touchmyapi_migrate@127.0.0.1:5432/touchmyapi_ci_integration_test bun run db:migrate
          DATABASE_URL=postgres://touchmyapi_migrate:touchmyapi_migrate@127.0.0.1:5432/touchmyapi_ci_isolation_test bun run db:migrate

      - name: Run unit tests
        run: bun run test:unit

      - name: Run contract tests
        run: bun run test:contract

      - name: Run integration tests
        run: bun run test:integration --maxWorkers=1
        env:
          DATABASE_URL: postgres://touchmyapi_migrate:touchmyapi_migrate@127.0.0.1:5432/touchmyapi_ci_integration_test

      - name: Run isolation tests
        run: bun run test:isolation --maxWorkers=1
        env:
          DATABASE_URL: postgres://touchmyapi_migrate:touchmyapi_migrate@127.0.0.1:5432/touchmyapi_ci_isolation_test

      - name: Run local e2e gate
        env:
          TOUCHMYAPI_EXTERNAL_MINIO: "1"
        run: |
          set -eu
          log_file=$(mktemp)
          launcher=0
          docker run -d --name touchmyapi-ci-minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=touchmyapi_dev \
            -e MINIO_ROOT_PASSWORD=touchmyapi_dev_change_me \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          bun run dev:local >"$log_file" 2>&1 &
          launcher=$!
          cleanup() {
            if [ "$launcher" -ne 0 ]; then
              kill "$launcher" 2>/dev/null || true
              wait "$launcher" 2>/dev/null || true
            fi
            docker rm -f touchmyapi-ci-minio >/dev/null 2>&1 || true
            if [ -s "$log_file" ]; then
              tail -80 "$log_file"
            fi
            rm -f "$log_file"
          }
          trap cleanup EXIT
          bun run local:smoke
          bun run test:e2e

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format

      - name: Build web application
        run: bun run --cwd apps/web build

      - name: Build admin application
        run: bun run --cwd apps/admin build

      - name: Validate compose configuration
        run: docker compose -f infra/docker/compose.yml config

      - name: Check diff whitespace
        run: git diff --check
